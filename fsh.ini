; ESPBI IG — FSH build settings
;
; Canonical SUSHI configuration lives in sushi-config.yaml (required by
; SUSHI). This file records the local build knobs — timeouts,
; command invocations, expected tool versions — so they are reviewable
; in one place without reading every shell script.
;
; Consumed by humans and the convenience scripts; SUSHI itself does
; not read this file.

[FSH]
fhir_version     = 5.0.0
sushi_min        = 3.18.1
publisher_jar    = ../publisher.jar

[Build]
; Default command for fast local iteration (FSH -> FHIR JSON only).
sushi_cmd        = sushi .

; Full IG build (SUSHI + IG Publisher) — writes ./output/.
ig_cmd           = java -jar ../publisher.jar -ig .

; Maximum allowed wall-clock duration of a single build, in seconds.
; Aligned with the Claude Code harness' BASH_MAX_TIMEOUT_MS
; (.claude/settings.json) so both agree on the ceiling.
build_timeout_s  = 900

[Artifacts]
; Generated outputs — gitignored.
fsh_generated    = fsh-generated/
ig_output        = output/
tx_cache         = input-cache/
temp             = temp/
template         = template/

[Paths]
fsh_sources      = input/fsh
pagecontent      = input/pagecontent
examples         = input/fsh/examples
terminology      = input/fsh/terminology
rulesets         = input/fsh/rulesets

[Migration]
; Simplifier JSON source tree (read-only reference).
simplifier_src   = simplifier/
; Migration output from scripts/migrate-simplifier-with-chef.sh.
; Tracked only on release branches; gitignored on main.
migration_dst    = input/fsh/migrated/
